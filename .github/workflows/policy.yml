name: PR policy
on:
  pull_request_target:
    branches: [main]
    types: [labeled, unlabeled]
    paths-ignore: ['**/*.md', 'docs/**', 'LICENSE*', '**/provenance.json']
  workflow_run:
    workflows: [Smoke]
    types: [completed]
  status:
permissions:
  contents: read
concurrency:
  group: policy-${{ ((github.event_name == 'status' && github.event.context != 'local-ci/full') || (github.event_name == 'pull_request_target' && !contains(fromJSON('["ci:full","ci:release","ci:local-verified"]'), github.event.label.name)) || (github.event_name == 'workflow_run' && github.event.workflow_run.event != 'pull_request')) && format('ignored-{0}', github.run_id) || github.event.pull_request.head.sha || github.event.workflow_run.head_sha || github.event.sha }}
  cancel-in-progress: true
jobs:
  policy:
    if: >-
      vars.CI_MODE != 'off' && vars.BIKELAB_HOSTED_CI_ENABLED != 'false' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.event == 'pull_request') &&
      (github.event_name != 'status' || github.event.context == 'local-ci/full') &&
      (github.event_name != 'pull_request_target' ||
       contains(fromJSON('["ci:full","ci:release","ci:local-verified"]'), github.event.label.name))
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
      pull-requests: read
      statuses: write
    steps:
      # Metadata only: never execute the PR branch with this write-capable token.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci-github.mjs policy
