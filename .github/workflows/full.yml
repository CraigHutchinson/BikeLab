# Quota hold through 2026-10-31: remove the literal false guards only on/after 1 November.
name: Full
on:
  push:
    tags: ['v*', 'milestone/*']
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: '23 4 * * 1'
permissions:
  contents: read
concurrency:
  group: full-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  plan:
    if: >-
      false && vars.BIKELAB_HOSTED_CI_ENABLED == 'true' &&
      (github.event_name != 'pull_request' ||
       ((github.event.action != 'labeled' || github.event.label.name == 'ci:full' || github.event.label.name == 'ci:release') &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        (contains(github.event.pull_request.labels.*.name, 'ci:full') ||
         contains(github.event.pull_request.labels.*.name, 'ci:release'))))
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      statuses: read
    outputs:
      run: ${{ steps.plan.outputs.run }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci-github.mjs full-plan
  unit:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: node scripts/local-ci.mjs unit
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: unit-${{ matrix.os }}
          path: artifacts/ci
          retention-days: 14
  browser:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.npm
          key: npm-playwright-1.56.1-${{ runner.os }}-${{ runner.arch }}
      - name: Install pinned isolated browser tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/bikelab-browser" --no-save --package-lock=false playwright@1.56.1
          "$RUNNER_TEMP/bikelab-browser/node_modules/.bin/playwright" install --with-deps chromium
      - run: node scripts/rider-idle-review.mjs artifacts/rider-idle
      - env:
          NODE_PATH: ${{ runner.temp }}/bikelab-browser/node_modules
        run: node scripts/browser-check.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: browser-and-idle-evidence
          path: |
            artifacts/browser
            artifacts/rider-idle
          if-no-files-found: error
          retention-days: 14
  result:
    needs: [plan, unit, browser]
    if: >-
      always() && false && vars.BIKELAB_HOSTED_CI_ENABLED == 'true' &&
      needs.plan.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      statuses: write
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - env:
          GITHUB_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ needs.plan.outputs.sha }}
          UNIT_RESULT: ${{ needs.unit.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: node scripts/ci-github.mjs full-result
